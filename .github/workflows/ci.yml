name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: read

defaults:
  run:
    working-directory: atlas-lite

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,test]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    name: typecheck (mypy --strict on api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,test]"
      - run: mypy src/atlas

  test:
    name: test (pytest + coverage gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,test]"
      - run: pytest --cov --cov-report=xml --cov-report=term-missing
      - run: pytest tests/api --cov=src/atlas/api --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: atlas-lite/coverage.xml
          if-no-files-found: error

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m cyclonedx_py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: atlas-lite/sbom.cdx.json
          if-no-files-found: error

  docker:
    name: docker (build only)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: atlas-lite
          file: atlas-lite/Dockerfile
          push: false
          tags: atlas-lite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
