[project]
name = "atlas-lite"
version = "0.1.0"
description = "Atlas Lite — deterministic, hallucination-proof field-lineage extraction (tree-sitter)."
requires-python = ">=3.12"
authors = [{ name = "Atlas Authors" }]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
test = ["pytest>=8.3", "hypothesis>=6.115"]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "TID"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
