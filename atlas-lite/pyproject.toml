[project]
name = "atlas-lite"
version = "0.2.0"
description = "Atlas Lite — deterministic field-lineage extraction + read API + drift gate."
requires-python = ">=3.12"
authors = [{ name = "Atlas Authors" }]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "cachetools>=5.5",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "types-cachetools",
    "pre-commit>=4.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Curated rule set — pragmatic for a tooling repo. Keep ANN off the
# legacy modules (extract.py, resolvers.py) and tighten only on the
# new API surface where types are already first-class.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RET", # return statements
    "TID", # tidy-imports
    "PTH", # pathlib
    "G",   # logging-format
]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # function call in default arg — FastAPI Depends idiom
    "TID252", # relative imports — common in our api/ subpackages
    "PTH111", # os.path.expanduser — pragmatic, leave as-is
    "PTH120", # os.path.dirname — same
    "PTH118", # os.path.join — same
    "UP046",  # Generic[T] base — required by Pydantic v2 generics
    "G004",   # f-strings in logging — readability over performance for low-volume logs
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "S101"]
"src/atlas/cli.py" = ["E402"]
"src/atlas/extract.py" = ["N806", "E702", "B007", "SIM103", "RET504", "SIM222"]
"src/atlas/resolvers.py" = ["F841"]
"src/atlas/schemas.py" = ["N806", "SIM103"]
"src/atlas/render.py" = ["E702"]
"src/atlas/api/routers/*.py" = ["E702"]
"src/atlas/api/middleware/auth.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
strict = false  # global lenient — opt-in strict per module below
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "atlas.api.*"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["jose.*", "cachetools.*", "tree_sitter.*", "tree_sitter_java.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Legacy modules — extraction predates the strict-typing roll-out and is
# retyped opportunistically. The drift gate ensures regressions can't
# slip through coverage; mypy here is best-effort.
module = ["atlas.extract", "atlas.index", "atlas.validate", "atlas.cli", "atlas.resolvers", "atlas.schemas"]
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["src/atlas"]
omit = [
    "src/atlas/__main__.py",
    "src/atlas/validate.py",  # dead code path, scheduled for removal
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
# Phase 2.3 baseline. Tightened to 80% incrementally as legacy modules
# (cli, schemas, extract long-tail) gain dedicated unit coverage. The
# `make cov-api` target enforces ≥85% on the new atlas.api subpackage —
# every new endpoint must come with tests that keep it green.
fail_under = 70
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
