[project]
name = "atlas-aggregator"
version = "0.1.0"
description = "Atlas: aggregate manifests into atlas-kb (Markdown + JSON-LD + SQLite)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
atlas-agg = "atlas_aggregator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_aggregator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]
