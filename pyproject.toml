[project]
name = "atlas"
version = "0.1.0"
description = "Deterministic field-level lineage extraction (workspace root)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/atlas-aggregator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "TID"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
